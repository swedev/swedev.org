# nginx site for swedev.org — static export rsynced to /var/www/swedev.org by
# .github/workflows/deploy.yaml. TLS blocks are added by certbot --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name swedev.org www.swedev.org;

    root /var/www/swedev.org;
    index index.html;

    # Apex → www
    if ($host = swedev.org) {
        return 301 https://www.swedev.org$request_uri;
    }

    # Next static export uses trailingSlash, so /foo/ → /foo/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Hashed build assets are immutable
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
